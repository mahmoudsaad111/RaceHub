server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the API hostname per-request (via
    # the variable below) instead of once at startup means nginx picks up
    # the API container's new IP whenever it's rebuilt/restarted — a
    # static proxy_pass hostname caches the first IP forever and 502s
    # after any API container recreation.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://racehub-api:8080;

    # Angular SPA routing — any path that isn't a real file falls back to
    # index.html so client-side routes (e.g. /lobby, /room/123) work on
    # a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container. The frontend's
    # environment.prod.ts points apiUrl at '/api', so this is the only
    # thing wiring the SPA to the API in production — no CORS needed
    # since both are same-origin from the browser's point of view.
    # proxy_pass uses the $api_upstream variable (not the literal
    # hostname) so the resolver above is actually consulted. No URI is
    # appended — with variables, nginx passes the original request URI
    # through unchanged, and the backend already serves under /api/.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub — needs WebSocket upgrade headers. Same variable-based
    # proxy_pass as /api/ above.
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets: cache aggressively, they're content-hashed by the
    # Angular build (outputHashing: all).
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
